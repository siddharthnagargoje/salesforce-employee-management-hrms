<template>
    <div class="dashboard-layout">

        <!-- Sidebar -->
        <c-sidebar active-page={currentPage} ontogglesidebar={handleToggleSidebar} onnavigate={handleNavigation}></c-sidebar>

        <!-- Main Content -->
        <main class="dashboard-content">

            <template if:true={isDashboard}>
                <section class="dashboard-page">

                    <!-- Dashboard Header -->
                    <header class="dashboard-header">
                        <div class="header-ambient-glow"></div>
                        <div class="header-background-circle circle-one"></div>
                        <div class="header-background-circle circle-two"></div>

                        <div class="dashboard-header-content">
                            <div class="header-text">
                                <div class="header-pill">
                                    <span class="header-status-dot"></span>
                                    <span class="header-eyebrow">HR WORKSPACE</span>
                                </div>

                                <h1>
                                    Hello, HR Admin
                                    <span class="wave">👋</span>
                                </h1>

                                <p>
                                    Here's what's happening across your workforce today.
                                </p>
                            </div>

                            <div class="header-actions">
                                <button class="secondary-button" onclick={navigateToEmployees} title="Add New Employee">
                                    <lightning-icon icon-name="utility:add" alternative-text="Add employee" size="xx-small">
                                    </lightning-icon>
                                    <span>Add Employee</span>
                                </button>

                                <button class="primary-button" onclick={navigateToPayslip} title="Generate Monthly Payslips">
                                    <lightning-icon icon-name="utility:money" alternative-text="Generate payslip" size="xx-small">
                                    </lightning-icon>
                                    <span>Generate Payslip</span>
                                </button>

                                <div class="user-avatar" title="HR Administrator">
                                    <span>HR</span>
                                </div>
                            </div>
                        </div>
                    </header>

                    <!-- KPI Cards -->
                    <section class="kpi-grid">

                        <!-- Active Employees -->
                        <article class="kpi-card kpi-employees">
                            <div class="kpi-card-header">
                                <div class="kpi-meta">
                                    <span class="kpi-label">Active Employees</span>
                                    <div class="kpi-value">{totalEmployees}</div>
                                </div>
                                <div class="kpi-icon icon-blue">
                                    <lightning-icon icon-name="utility:people" alternative-text="Employees" size="small">
                                    </lightning-icon>
                                </div>
                            </div>

                            <div class="kpi-footer">
                                <span class="trend-badge trend-positive">
                                    <lightning-icon icon-name="utility:arrowup" size="xx-small" alternative-text="Growth"></lightning-icon>
                                    <span>{employeeGrowthTrend}</span>
                                </span>
                                <span class="kpi-subtext">Active Workforce</span>
                            </div>
                        </article>

                        <!-- Gross Payroll -->
                        <article class="kpi-card kpi-payroll">
                            <div class="kpi-card-header">
                                <div class="kpi-meta">
                                    <span class="kpi-label">Gross Payroll</span>
                                    <div class="kpi-value">{totalPayrollDisplay}</div>
                                </div>
                                <div class="kpi-icon icon-emerald">
                                    <lightning-icon icon-name="utility:money" alternative-text="Payroll" size="small">
                                    </lightning-icon>
                                </div>
                            </div>

                            <div class="kpi-footer">
                                <span class="trend-badge trend-emerald">
                                    <span class="live-dot-mini"></span>
                                    <span>Live Ledger</span>
                                </span>
                                <span class="kpi-subtext">Current month</span>
                            </div>
                        </article>

                        <!-- Attendance Today -->
                        <article class="kpi-card kpi-attendance">
                            <div class="kpi-card-header">
                                <div class="kpi-meta">
                                    <span class="kpi-label">Attendance Today</span>
                                    <div class="kpi-value">{attendancePercent}</div>
                                </div>
                                <div class="kpi-icon icon-indigo">
                                    <lightning-icon icon-name="utility:date_time" alternative-text="Attendance" size="small">
                                    </lightning-icon>
                                </div>
                            </div>

                            <div class="kpi-footer">
                                <span class="trend-badge trend-positive">
                                    <span class="live-dot-mini"></span>
                                    <span>On Track</span>
                                </span>
                                <span class="kpi-subtext">Daily check-ins</span>
                            </div>
                        </article>
                    </section>

                    <!-- Dashboard Grid -->
                    <section class="dashboard-grid">

                        <!-- Attendance Table -->
                        <article class="dashboard-card attendance-card">
                            <div class="card-heading">
                                <div class="heading-content">
                                    <div class="heading-icon blue-heading-icon">
                                        <lightning-icon icon-name="utility:clock" alternative-text="Attendance" size="x-small">
                                        </lightning-icon>
                                    </div>

                                    <div>
                                        <h2>Today's Attendance</h2>
                                        <p>Live employee punch activity</p>
                                    </div>
                                </div>

                                <span class="live-badge">
                                    <span class="live-dot"></span>
                                    <span>Live Feed</span>
                                </span>
                            </div>

                            <div class="table-wrapper">
                                <table class="attendance-table">
                                    <thead>
                                        <tr>
                                            <th scope="col">Employee</th>
                                            <th scope="col">Check-In</th>
                                            <th scope="col">Status</th>
                                        </tr>
                                    </thead>

                                    <tbody>
                                        <template for:each={attendanceLogs} for:item="log">
                                            <tr key={log.id}>
                                                <td>
                                                    <div class="employee-cell">
                                                        <span class="employee-mini-avatar">
                                                            {log.initials}
                                                        </span>

                                                        <span class="employee-table-name" title={log.name}>
                                                            {log.name}
                                                        </span>
                                                    </div>
                                                </td>

                                                <td class="check-in-time">
                                                    <span class="time-badge">{log.checkIn}</span>
                                                </td>

                                                <td>
                                                    <span class={log.statusClass}>
                                                        <span class="status-indicator-dot"></span>
                                                        <span>{log.statusLabel}</span>
                                                    </span>
                                                </td>
                                            </tr>
                                        </template>

                                        <template if:true={hasNoAttendanceLogs}>
                                            <tr class="empty-table-row">
                                                <td colspan="3">
                                                    <div class="empty-state-box">
                                                        <div class="empty-icon-wrapper">
                                                            <lightning-icon icon-name="utility:date_time" size="small" alternative-text="No Attendance">
                                                            </lightning-icon>
                                                        </div>
                                                        <p class="empty-state-title">No check-ins recorded yet today</p>
                                                        <p class="empty-state-desc">Employee attendance timestamps will appear live as team members punch in.</p>
                                                    </div>
                                                </td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </div>

                            <div class="card-bottom-note">
                                <span class="note-icon">
                                    <lightning-icon icon-name="utility:info" alternative-text="Information" size="xx-small">
                                    </lightning-icon>
                                </span>
                                <span>Attendance is dynamically synchronized with biometric and portal timestamps.</span>
                            </div>
                        </article>

                        <!-- Right Column -->
                        <div class="right-dashboard-column">

                            <!-- Attendance Rate -->
                            <article class="dashboard-card attendance-rate-card">
                                <div class="card-heading">
                                    <div class="heading-content">
                                        <div class="heading-icon purple-heading-icon">
                                            <lightning-icon icon-name="utility:chart" alternative-text="Attendance rate" size="x-small">
                                            </lightning-icon>
                                        </div>

                                        <div>
                                            <h2>Attendance Rate</h2>
                                            <p>Workforce presence ratio</p>
                                        </div>
                                    </div>
                                </div>

                                <div class="donut-container">
                                    <div class="donut-chart">
                                        <div class="donut-inner">
                                            <strong>{attendancePercent}</strong>
                                            <span>Present</span>
                                        </div>
                                    </div>
                                </div>

                                <div class="donut-footer">
                                    <div class="legend-item">
                                        <span class="legend-dot present-dot"></span>
                                        <span>Present</span>
                                    </div>

                                    <div class="legend-item">
                                        <span class="legend-dot remaining-dot"></span>
                                        <span>Remaining</span>
                                    </div>
                                </div>
                            </article>

                            <!-- Pending Requests -->
                            <article class="dashboard-card requests-card">
                                <div class="card-heading">
                                    <div class="heading-content">
                                        <div class="heading-icon rose-heading-icon">
                                            <lightning-icon icon-name="utility:approval" alternative-text="Pending requests" size="x-small">
                                            </lightning-icon>
                                        </div>

                                        <div>
                                            <h2>Pending Requests</h2>
                                            <p>Items requiring manager review</p>
                                        </div>
                                    </div>

                                    <span class="request-count" title="Pending requests count">
                                        {pendingRequestsCount}
                                    </span>
                                </div>

                                <div class="request-list">
                                    <template for:each={pendingRequests} for:item="req">
                                        <div key={req.id} class="request-item" onclick={navigateToLeave} role="button" tabindex="0" title="Review leave request">
                                            <div class="request-item-top">
                                                <span class="request-employee" title={req.employee}>
                                                    {req.employee}
                                                </span>

                                                <span class={req.typeClass}>
                                                    {req.type}
                                                </span>
                                            </div>

                                            <div class="request-item-bottom">
                                                <lightning-icon icon-name="utility:event" size="xx-small" alternative-text="Leave duration">
                                                </lightning-icon>
                                                <p class="request-dates">{req.details}</p>
                                            </div>

                                            <span class="request-arrow">
                                                <lightning-icon icon-name="utility:chevronright" alternative-text="Open request" size="xx-small">
                                                </lightning-icon>
                                            </span>
                                        </div>
                                    </template>

                                    <template if:true={hasNoPendingRequests}>
                                        <div class="no-requests">
                                            <div class="no-request-icon">
                                                <lightning-icon icon-name="utility:success" alternative-text="No requests" size="small">
                                                </lightning-icon>
                                            </div>

                                            <span>No pending requests</span>
                                            <small>All team requests are reviewed & up to date 🎉</small>
                                        </div>
                                    </template>
                                </div>
                            </article>

                        </div>
                    </section>
                </section>
            </template>

            <!-- Other Pages -->
            <template if:true={isEmployees}>
                <c-employee-management class="page-animation"></c-employee-management>
            </template>

            <template if:true={isAttendance}>
                <c-attendance-management class="page-animation"></c-attendance-management>
            </template>

            <template if:true={isLeave}>
                <c-leave-request class="page-animation"></c-leave-request>
            </template>

            <template if:true={isReports}>
                <c-reports-management class="page-animation"></c-reports-management>
            </template>

            <template if:true={isSettings}>
                <c-settings-management class="page-animation"></c-settings-management>
            </template>

            <template if:true={isPayslip}>
                <c-payslip-management class="page-animation"></c-payslip-management>
            </template>
        </main>
    </div>
</template>
