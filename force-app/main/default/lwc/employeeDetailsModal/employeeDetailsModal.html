<template>
    <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
        <div class="slds-modal__container">
            <header class="slds-modal__header">
                <lightning-button-icon icon-name="utility:close" alternative-text="Close" class="slds-modal__close"
                    onclick={handleClose}></lightning-button-icon>
                <h2 class="slds-text-heading_medium">Add Employee</h2>
            </header>

            <div class="slds-modal__content slds-p-around_medium">
                <lightning-input label="First Name" value={firstName} onchange={handleFirstName}></lightning-input>
                <lightning-input label="Last Name" value={lastName} onchange={handleLastName}></lightning-input>
                <lightning-input type="email" label="Email" value={email} onchange={handleEmail}></lightning-input>
                <lightning-input label="Mobile" value={mobile} onchange={handleMobile}></lightning-input>
                <lightning-input label="Designation" value={designation} onchange={handleDesignation}></lightning-input>
                <lightning-input type="number" label="Salary" value={salary} onchange={handleSalary}></lightning-input>
            </div>

            <footer class="slds-modal__footer">
                <lightning-button label="Cancel" onclick={handleClose}></lightning-button>
                <lightning-button variant="brand" label="Save" onclick={saveEmployee}></lightning-button>
            </footer>
        </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
</template>
